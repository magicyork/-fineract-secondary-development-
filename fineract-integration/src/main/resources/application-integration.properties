# ==============================================================================
# Fineract Integration with Core Banking System Configuration
# ==============================================================================

# Core Banking System Connection
fineract.integration.core.enabled=true
fineract.integration.core.base-url=${CORE_BANKING_URL:https://core-bank.example.com}
fineract.integration.core.api-path-prefix=${CORE_BANKING_API_PREFIX:/api/v1}
fineract.integration.core.tenant-id=${FINERACT_TENANT_ID:default}
fineract.integration.core.client-id=${CORE_BANKING_CLIENT_ID:fineract-credit}
fineract.integration.core.client-secret=${CORE_BANKING_CLIENT_SECRET:}

# Timeout Configuration
fineract.integration.core.connect-timeout-ms=${CORE_BANKING_CONNECT_TIMEOUT:5000}
fineract.integration.core.read-timeout-ms=${CORE_BANKING_READ_TIMEOUT:30000}
fineract.integration.core.write-timeout-ms=${CORE_BANKING_WRITE_TIMEOUT:30000}

# Data Sync Configuration
fineract.integration.core.data-sync.client-sync-enabled=${CLIENT_SYNC_ENABLED:true}
fineract.integration.core.data-sync.account-sync-enabled=${ACCOUNT_SYNC_ENABLED:true}
fineract.integration.core.data-sync.product-sync-enabled=${PRODUCT_SYNC_ENABLED:true}
fineract.integration.core.data-sync.client-sync-cron=${CLIENT_SYNC_CRON:0 0/5 * * * ?}
fineract.integration.core.data-sync.account-sync-cron=${ACCOUNT_SYNC_CRON:0 0/10 * * * ?}

# Kafka Event Configuration
fineract.integration.core.event.kafka-enabled=${KAFKA_ENABLED:true}
fineract.integration.core.event.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
fineract.integration.core.event.core-event-topic=${CORE_EVENT_TOPIC:core-banking-events}
fineract.integration.core.event.fineract-event-topic=${FINERACT_EVENT_TOPIC:fineract-credit-events}
fineract.integration.core.event.consumer-group=${KAFKA_CONSUMER_GROUP:fineract-integration}

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.delivery-timeout-ms=30000
spring.kafka.producer.request-timeout-ms=10000

# Kafka Consumer Configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:fineract-integration}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.properties.spring.json.trusted.packages=*
