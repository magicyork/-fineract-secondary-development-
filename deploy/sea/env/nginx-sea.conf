# =============================================================================
# Nginx Reverse Proxy Configuration for Southeast Asia Production
# SSL Termination + Rate Limiting + Security Headers
# =============================================================================

user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ---- Basic Settings ----
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'request_id=$request_time '
                  'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    # ---- Timeouts ----
    keepalive_timeout 65;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;

    # ---- Buffer Settings ----
    client_max_body_size 20m;
    client_body_buffer_size 128k;
    proxy_buffer_size 256k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ---- Rate Limiting Zones ----
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ---- Upstream: Fineract Servers ----
    upstream fineract_backend {
        least_conn;
        server fineract-manager:8443 weight=3 max_fails=3 fail_timeout=30s;
        server fineract-worker-1:8443 weight=1 max_fails=3 fail_timeout=30s;
        server fineract-worker-2:8443 weight=1 max_fails=3 fail_timeout=30s backup;
        keepalive 32;
    }

    # ---- Server: HTTPS ----
    server {
        listen 443 ssl http2;
        server_name api.your-domain.com;

        # ---- SSL Configuration ----
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ---- Security Headers ----
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # ---- Health Check Endpoint ----
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ---- API Endpoints ----
        location /fineract-provider/ {
            limit_req zone=api burst=200 nodelay;
            limit_conn addr 100;

            proxy_pass https://fineract_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Connection $proxy_connection;

            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/certs/backend-ca.crt;
            proxy_ssl_name fineract_backend;
        }

        # ---- Prometheus Metrics (Internal Only) ----
        location /actuator/prometheus {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass https://fineract_backend;
            proxy_set_header Host $host;
        }

        # ---- Actuator Health (Internal Only) ----
        location /actuator/health {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass https://fineract_backend;
            proxy_set_header Host $host;
        }

        # ---- Webhook/Callback Endpoints ----
        location /api/v1/payments/ {
            limit_req zone=general burst=100 nodelay;

            proxy_pass https://fineract_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;
        }

        # ---- Block Suspicious Requests ----
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$) {
            return 405;
        }

        if ($http_user_agent ~* (nikto|sqlmap|scanner|nmap)) {
            return 403;
        }

        # ---- Deny Access to Hidden Files ----
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ---- HTTP -> HTTPS Redirect ----
    server {
        listen 80;
        server_name api.your-domain.com;
        return 301 https://$host$request_uri;
    }
}
