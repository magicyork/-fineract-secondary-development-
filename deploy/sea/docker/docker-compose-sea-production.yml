# =============================================================================
# Apache Fineract - Southeast Asia Production Deployment
# Supported: Philippines (PHP) | Indonesia (IDR) | Cambodia (KHR)
# =============================================================================
# NOT FOR DEVELOPMENT/TESTING USE - PRODUCTION GRADE CONFIGURATION
# =============================================================================

version: "3.8"

x-fineract-common: &fineract-common
  image: fineract-sea:latest
  user: "1000:1000"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  read_only: true
  allow_reuse_address: true
  restart: unless-stopped
  tmpfs:
    - /tmp:rw,nosuid,size=512m
    - /var/logs/fineract:rw,size=1g
  healthcheck:
    test: ["CMD", "sh", "-c", "while ! nc -z localhost 8443; do sleep 2; printf '-'; done; echo ' OK'"]
    timeout: 5s
    retries: 60
    interval: 5s
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 4g
      reservations:
        cpus: "0.5"
        memory: 2g

x-db-common: &db-common
  image: postgres:16-alpine
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U fineract -d fineract_tenants"]
    timeout: 10s
    retries: 5
    interval: 10s

x-kafka-common: &kafka-common
  image: apache/kafka:3.7.1
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

secrets:
  fineract_db_password:
    external: true
  fineract_kafka_password:
    external: true

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  database:
    driver: bridge
    internal: true

volumes:
  fineract_db_data:
    driver: local
  fineract_db_backup:
    driver: local
  fineract_logs:
    driver: local
  fineract_config:
    driver: local
  kafka_data:
    driver: local

services:

  # =========================================================================
  # 1. PostgreSQL Primary Database
  # =========================================================================
  db-primary:
    <<: *db-common
    container_name: fineract-db-primary
    networks:
      - database
    environment:
      POSTGRES_USER: fineract
      POSTGRES_PASSWORD_FILE: /run/secrets/fineract_db_password
      POSTGRES_DB: fineract_tenants
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=UTF-8"
    secrets:
      - fineract_db_password
    volumes:
      - fineract_db_data:/var/lib/postgresql/data
      - fineract_db_backup:/backup
      - ../env/postgresql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../env/postgresql-postgis.sql:/docker-entrypoint-initdb.d/02-postgis.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      -c max_connections=100
      -c shared_buffers=2GB
      -c effective_cache_size=4GB
      -c maintenance_work_mem=256MB
      -c wal_buffers=16MB
      -c max_wal_size=2GB
      -c min_wal_size=512MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c maintenance_work_mem=256MB
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_temp_files=0
      -c ssl=on
      -c ssl_cert=/etc/postgres/certs/server.crt
      -c ssl_key=/etc/postgres/certs/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineract -d fineract_tenants -h localhost"]
      timeout: 5s
      retries: 3
      interval: 5s
      start_period: 30s

  # =========================================================================
  # 2. PostgreSQL Read Replica
  # =========================================================================
  db-replica:
    <<: *db-common
    container_name: fineract-db-replica
    networks:
      - database
    environment:
      POSTGRES_USER: fineract
      POSTGRES_PASSWORD_FILE: /run/secrets/fineract_db_password
      POSTGRES_DB: fineract_tenants
    secrets:
      - fineract_db_password
    volumes:
      - fineract_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    command: >
      -c max_connections=50
      -c shared_buffers=2GB
      -c hot_standby=on
      -c max_standby_streaming_delay=30s
      -c log_min_duration_statement=5000
    depends_on:
      db-primary:
        condition: service_healthy

  # =========================================================================
  # 3. Redis Cache
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: fineract-redis
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save "600 1"
      --save "300 10"
      --save "60 10000"
      --bind 127.0.0.1
      --protected-mode yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      timeout: 3s
      retries: 3
      interval: 5s

  # =========================================================================
  # 4. Apache Kafka (For External Events & Job Distribution)
  # =========================================================================
  kafka:
    <<: *kafka-common
    container_name: fineract-kafka
    networks:
      - backend
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      timeout: 10s
      retries: 5
      interval: 10s
      start_period: 30s

  # =========================================================================
  # 5. Fineract Manager Node (Handles API Requests)
  # =========================================================================
  fineract-manager:
    <<: *fineract-common
    container_name: fineract-manager
    hostname: fineract-manager
    networks:
      - backend
      - database
      - frontend
    env_file:
      - ../env/fineract-sea-common.env
      - ../env/fineract-${COUNTRY}-prod.env
    environment:
      FINERACT_NODE_ID: 1
      FINERACT_MODE_BATCH_MANAGER_ENABLED: "true"
      FINERACT_MODE_BATCH_WORKER_ENABLED: "false"
      FINERACT_MODE_READ_ENABLED: "true"
      FINERACT_MODE_WRITE_ENABLED: "true"
    ports:
      - "8443:8443"
    volumes:
      - fineract_logs:/var/logs/fineract
      - fineract_config:/app/config
      - ../config/docker/logback/logback-override.xml:/app/logback-override.xml:ro
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================================================================
  # 6. Fineract Worker Node (Handles Batch Jobs: Cob, Interest, etc.)
  # =========================================================================
  fineract-worker-1:
    <<: *fineract-common
    container_name: fineract-worker-1
    hostname: fineract-worker-1
    networks:
      - backend
      - database
    env_file:
      - ../env/fineract-sea-common.env
      - ../env/fineract-${COUNTRY}-prod.env
    environment:
      FINERACT_NODE_ID: 2
      FINERACT_MODE_BATCH_MANAGER_ENABLED: "false"
      FINERACT_MODE_BATCH_WORKER_ENABLED: "true"
      FINERACT_MODE_READ_ENABLED: "true"
      FINERACT_MODE_WRITE_ENABLED: "true"
    volumes:
      - fineract_logs:/var/logs/fineract
      - fineract_config:/app/config
      - ../config/docker/logback/logback-override.xml:/app/logback-override.xml:ro
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fineract-worker-2:
    <<: *fineract-common
    container_name: fineract-worker-2
    hostname: fineract-worker-2
    networks:
      - backend
      - database
    env_file:
      - ../env/fineract-sea-common.env
      - ../env/fineract-${COUNTRY}-prod.env
    environment:
      FINERACT_NODE_ID: 3
      FINERACT_MODE_BATCH_MANAGER_ENABLED: "false"
      FINERACT_MODE_BATCH_WORKER_ENABLED: "true"
      FINERACT_MODE_READ_ENABLED: "true"
      FINERACT_MODE_WRITE_ENABLED: "true"
    volumes:
      - fineract_logs:/var/logs/fineract
      - fineract_config:/app/config
      - ../config/docker/logback/logback-override.xml:/app/logback-override.xml:ro
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================================================================
  # 7. Nginx Reverse Proxy (SSL Termination + Rate Limiting)
  # =========================================================================
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: fineract-nginx
    networks:
      - frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      fineract-manager:
        condition: service_healthy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../env/nginx-sea.conf:/etc/nginx/nginx.conf:ro
      - ../env/nginx-certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:443/health"]
      timeout: 5s
      retries: 3
      interval: 10s
